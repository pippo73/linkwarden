# Builds a standalone, installable Android APK of the mobile app so the
# self-signed-certificate fix can be tested on a real device.
# The APK is uploaded as a workflow artifact (no Expo account needed):
# assembleRelease bundles the JS in and is signed with the default debug
# keystore, so it installs and runs without a Metro dev server.
name: Build Android test APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - ci/android-test-apk
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - name: Free disk space
        # The final packaging step can run out of disk on the runner once the
        # SDK, NDK, two-ABI native objects and R8 output pile up. Remove large
        # preinstalled toolchains we don't use to reclaim ~20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn prisma:generate

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Expo prebuild (generate android project)
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install

      - name: Tune Gradle for a lean test build
        # Packaging OOM'd in the APK zip compressor. Replace (not append) the
        # jvmargs line so the larger heap is actually applied, serialize the
        # packaging workers so parallel compressions don't add up, and disable
        # R8 minify + PNG crunch (pointless and memory-heavy for a test APK).
        # Print the effective RAM/config for the record.
        run: |
          cd apps/mobile/android
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g|' gradle.properties
          {
            echo "android.enableMinifyInReleaseBuilds=false"
            echo "android.enablePngCrunchInReleaseBuilds=false"
            echo "org.gradle.workers.max=1"
            echo "org.gradle.parallel=false"
          } >> gradle.properties
          echo "----- runner memory / effective gradle config -----"
          free -h || true
          nproc || true
          grep -E 'jvmargs|workers|parallel|Minify|PngCrunch' gradle.properties

      - name: Build release APK (JS bundled, debug-signed)
        working-directory: apps/mobile/android
        # Build only the :app module (not every library module) and skip the
        # release "vital" lint. Build a single ABI (x86_64 = emulator; switch
        # to arm64-v8a for a physical phone): packaging both ABIs' native libs
        # at once OOM'd the APK splitter. Single ABI also halves build time.
        # --stacktrace surfaces the real cause if packaging fails again.
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -x lintVitalRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkwarden-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
